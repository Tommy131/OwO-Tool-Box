name: owo_system_tools
description: A comprehensive Flutter application framework for multi-project development.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.0
  intl: ^0.20.2
  get_it: ^7.6.0
  logger: ^2.0.0
  shared_preferences: ^2.2.2
  bitsdojo_window: ^0.1.6
  fl_chart: ^0.66.0
  url_launcher: ^6.2.2
  http: ^1.5.0
  dartssh2: ^2.9.0
  flutter_secure_storage: ^8.0.0
  path_provider: ^2.1.1
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flag: ^7.0.0
  country_codes: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Microsoft-YaHei
      fonts:
        - asset: assets/fonts/Microsoft-YaHei-Regular.ttf
        - asset: assets/fonts/Microsoft-YaHei-Bold.ttf
          weight: 700

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#eeeeee"
    theme_color: "#fea31a"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 64 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
